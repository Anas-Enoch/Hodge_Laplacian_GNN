name: hodge-operator
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - python=3.11
  - pip

  # Core scientific stack
  - numpy>=1.24
  - scipy>=1.10
  - pandas>=2.0
  - scikit-learn>=1.3

  # Spatial transcriptomics
  - scanpy>=1.9
  - anndata>=0.9

  # Graph / network
  - networkx>=3.1
  - python-igraph>=0.11
  - leidenalg>=0.10

  # Visualisation
  - matplotlib>=3.7
  - seaborn>=0.12

  - pip:
    # PyTorch — swap for CUDA build if GPU available
    - torch>=2.0
    - torch-geometric>=2.3
    - torch-scatter
    - torch-sparse

    # Spatial statistics
    - squidpy>=1.3
    - pysal>=23.1

    # Utilities
    - tqdm>=4.65
    - joblib>=1.3
    - h5py>=3.9
    - zarr>=2.16
